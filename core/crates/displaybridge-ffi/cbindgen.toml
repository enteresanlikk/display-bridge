# cbindgen configuration for the DisplayBridge C ABI header.
#
# Emits plain C (not C++) with a `#pragma once` plus a classic include guard, so
# every native shell (Swift/Kotlin/C++/C#) can `#include "displaybridge_ffi.h"` directly.

language = "C"
pragma_once = true
include_guard = "DISPLAYBRIDGE_FFI_H"
cpp_compat = true
autogen_warning = "/* AUTO-GENERATED by cbindgen from the displaybridge-ffi crate. Do not edit by hand. */"
documentation = true
documentation_style = "doxy"
style = "type"

[export]
prefix = ""

[enum]
prefix_with_name = true
